<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duplicate overlap viewer</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8; --bar:#4f7cff; --bar2:#f2a33a; --sel:#e8efff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --fg:#ececf0; --muted:#9a9aa2; --line:#2c2c31; --bar:#6d92ff; --bar2:#f2b25a; --sel:#22304f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  #summary { color:var(--muted); }
  #drop { border:1px dashed var(--muted); border-radius:6px; padding:6px 12px; cursor:pointer; }
  #drop.over { background:var(--sel); }
  nav button { background:none; border:none; color:var(--muted); font:inherit; padding:4px 8px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--fg); border-bottom-color:var(--bar); }
  main { display:grid; grid-template-columns: minmax(420px, 55%) 1fr; height:calc(100vh - 54px); }
  #left, #right { overflow:auto; }
  #left { border-right:1px solid var(--line); }
  #right { padding:12px 16px; }
  .row { display:grid; grid-template-columns: 1fr 120px 72px 56px 72px; gap:8px; align-items:center; padding:2px 8px; cursor:pointer; white-space:nowrap; }
  .row:hover { background:var(--sel); }
  .row.sel { background:var(--sel); font-weight:600; }
  .row .name { overflow:hidden; text-overflow:ellipsis; }
  .tw { display:inline-block; width:14px; color:var(--muted); }
  .num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .muted { color:var(--muted); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; display:flex; }
  .bar i { display:block; height:100%; background:var(--bar); }
  .bar b { display:block; height:100%; background:var(--bar2); }
  .hdr { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); font-weight:600; color:var(--muted); cursor:default; }
  .hdr:hover { background:var(--bg); }
  table { border-collapse:collapse; width:100%; }
  td, th { padding:3px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--bg); }
  td.path { word-break:break-all; }
  a { color:var(--bar); cursor:pointer; text-decoration:none; }
  a:hover { text-decoration:underline; }
  h2 { font-size:14px; margin:14px 0 6px; }
  .path-title { word-break:break-all; font-weight:600; font-size:14px; }
  .stats { display:flex; gap:20px; margin:8px 0; flex-wrap:wrap; }
  .stats div span { display:block; font-size:18px; font-weight:600; }
  .in { font-weight:600; }
  .set { margin:6px 0 10px; }
  .set .paths div { word-break:break-all; padding-left:12px; }
  .legend { color:var(--muted); font-size:12px; margin:4px 8px; }
  .legend i, .legend b { display:inline-block; width:10px; height:8px; border-radius:2px; margin:0 4px 0 10px; }
  .legend i { background:var(--bar); } .legend b { background:var(--bar2); }
  #pairsFilter { margin:8px; padding:4px 8px; width:calc(100% - 16px); font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .empty { padding:40px; color:var(--muted); }
  main.full { grid-template-columns: 1fr; }
  main.full #right { display:none; }
  main.full #left { border-right:none; }
  .cmpbar { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:8px; display:grid; grid-template-columns: 1fr auto 1fr; gap:8px; align-items:center; }
  .cmpbar input { width:100%; font:inherit; padding:4px 8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .cmpbar button, .chips button { font:inherit; background:none; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 10px; cursor:pointer; }
  .chips { grid-column: 1 / -1; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chips button.off { opacity:.4; text-decoration:line-through; }
  .chips .note { color:var(--muted); margin-left:8px; }
  .cmp { display:grid; grid-template-columns: 1fr 1fr; }
  .cmp .dir { grid-column: 1 / -1; padding:6px 8px 2px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); }
  .cmp .c { padding:2px 8px; display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); min-height:22px; overflow:hidden; }
  .cmp .c .fn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmp .c .sub { color:var(--muted); font-size:12px; }
  .cmp .c:nth-child(odd) { border-right:1px solid var(--line); }
  .st-same   { background: color-mix(in srgb, #3aa55a 14%, transparent); }
  .st-moved  { background: color-mix(in srgb, #4f7cff 16%, transparent); }
  .st-left, .st-right { background: color-mix(in srgb, #f2a33a 18%, transparent); }
  .st-extra  { background: color-mix(in srgb, #9a9aa2 18%, transparent); }
  .st-none   { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--line) 70%, transparent) 6px 7px); }
  .chip-same { border-color:#3aa55a !important; } .chip-moved { border-color:#4f7cff !important; }
  .chip-left, .chip-right { border-color:#f2a33a !important; } .chip-extra { border-color:#9a9aa2 !important; }
</style>
</head>
<body>
<header>
  <h1>Duplicate overlap viewer</h1>
  <label id="drop">Open or drop a report (.txt or .jsonl)<input id="file" type="file" accept=".txt,.jsonl,.json" hidden></label>
  <nav><button data-tab="tree" class="on">Folders</button><button data-tab="pairs">Folder pairs</button><button data-tab="compare">Compare</button></nav>
  <span id="summary"></span>
</header>
<main>
  <div id="left"><div class="empty">Open a report from <code>dfs.bat</code>: the text report (<code>--format=text</code>) or JSONL. Nothing leaves this page.</div></div>
  <div id="right"></div>
</main>
<script src="analysis.js"></script>
<script>
'use strict';
const A = DfsAnalysis;
const fmt = A.formatBytes;
let model = null, approx = false, selected = null, tab = 'tree';
const expanded = new Set();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B = n => (approx && n > 0 ? '≈' : '') + fmt(n);
const $ = id => document.getElementById(id);

function load(text, name) {
  const report = A.parse(text);
  approx = report.approximate;
  model = A.analyse(report);
  expanded.clear();
  // Expand single-child chains from the top so the first branching level is visible.
  for (const r of A.roots(model)) {
    let n = r;
    while (n) {
      expanded.add(n.path);
      const kids = [...n.children];
      n = kids.length === 1 ? model.folders.get(kids[0]) : null;
    }
  }
  const reclaim = model.sets.reduce((t, s) => t + s.size * (s.copies.length - 1), 0);
  $('summary').textContent = name + ' · ' + report.format + ' · ' + model.sets.length.toLocaleString() + ' sets · '
    + model.files.length.toLocaleString() + ' paths · ' + B(reclaim) + ' reclaimable'
    + (approx ? ' · sizes ≈ (rounded in the text report)' : '');
  selected = null;
  render();
}

function childrenOf(n) {
  return [...n.children].map(p => model.folders.get(p))
    .sort((a, b) => b.bytesElsewhere - a.bytesElsewhere || b.internalBytes - a.internalBytes || a.name.localeCompare(b.name));
}

function render() {
  if (!model) return;
  document.querySelector('main').classList.toggle('full', tab === 'compare');
  if (tab === 'compare') { renderCompare(); return; }
  if (tab === 'tree') renderTree(); else renderPairs();
  renderDetail();
}

// ---- Compare: two folders side by side, like a dir-compare tool ----
let cmpA = '', cmpB = '';
const hidden = new Set();
const LABEL = { same: 'same path', moved: 'moved / renamed', left: 'only left', right: 'only right', extra: 'extra copy' };
const TIP = {
  same: 'a copy in both folders at the same relative path',
  moved: 'a copy in both folders, at a different relative path',
  left: 'duplicated somewhere, but no copy in the right folder',
  right: 'duplicated somewhere, but no copy in the left folder',
  extra: 'an additional copy inside one side of a file both sides hold',
};

function openCompare(a, b) {
  cmpA = a; cmpB = b; tab = 'compare'; setTab(); render();
}

function renderCompare() {
  const left = $('left');
  const keepFocus = document.activeElement && document.activeElement.id;
  let body;
  const nested = cmpA && cmpB && (cmpA === cmpB || cmpA.startsWith(cmpB + '/') || cmpB.startsWith(cmpA + '/'));
  if (!cmpA || !cmpB || !model.folders.has(cmpA) || !model.folders.has(cmpB)) {
    body = '<p class="empty">Pick two folders above (type to search), or use a "compare" link in the Folder pairs tab or in a folder\'s "Copies of these files live in" list.</p>';
  } else if (nested) {
    body = '<p class="empty">One folder contains the other. Pick two separate folders.</p>';
  } else {
    const c = A.compare(model, cmpA, cmpB);
    const chips = Object.keys(LABEL).map(s => `<button class="chip-${s}${hidden.has(s) ? ' off' : ''}" data-chip="${s}" title="${esc(TIP[s])}">${LABEL[s]}: ${c.counts[s].toLocaleString()} · ${B(c.bytes[s])}</button>`).join('');
    const rows = c.rows.filter(r => !hidden.has(r.status));
    const out = [];
    let dir = null;
    const dirOf = rel => rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
    const nameOf = rel => rel.slice(rel.lastIndexOf('/') + 1);
    const cell = (side, other, r) => {
      if (!side) return '<div class="c st-none"></div>';
      const elsewhere = other && dirOf(other.rel) !== dirOf(side.rel) ? `<span class="sub" title="${esc(other.rel)}">⇄ ${esc(dirOf(other.rel) || '(top)')}</span>` : '';
      const links = side.links.length ? `<span class="sub" title="${esc(side.links.join('\n'))}">+${side.links.length} hard link</span>` : '';
      return `<div class="c st-${r.status}" title="${esc(side.raw)}"><span class="fn">${esc(nameOf(side.rel))} ${elsewhere} ${links}</span><span class="sub num">${B(r.size)}</span></div>`;
    };
    for (const r of rows.slice(0, 3000)) {
      const d = dirOf((r.left || r.right).rel);
      if (d !== dir) { dir = d; out.push(`<div class="dir">${esc(d || '(top of both folders)')}</div>`); }
      out.push(cell(r.left, r.right, r) + cell(r.right, r.left, r));
    }
    body = `<div class="chips" style="padding:6px 8px">${chips}<span class="note">Only duplicated files are in a report: files with no copy anywhere are not shown on either side.</span></div>`
      + (rows.length > 3000 ? `<p class="muted" style="padding:0 8px">Showing 3,000 of ${rows.length.toLocaleString()} rows.</p>` : '')
      + `<div class="cmp">${out.join('')}</div>`;
  }
  left.innerHTML = `<div class="cmpbar">
      <input id="cmpA" list="allFolders" placeholder="Left folder" value="${esc(cmpA)}">
      <button id="swap" title="Swap sides">⇄</button>
      <input id="cmpB" list="allFolders" placeholder="Right folder" value="${esc(cmpB)}">
    </div><datalist id="allFolders">${A.folderPaths(model).map(p => `<option value="${esc(p)}">`).join('')}</datalist>` + body;
  $('cmpA').onchange = e => { cmpA = A.normal(e.target.value); renderCompare(); };
  $('cmpB').onchange = e => { cmpB = A.normal(e.target.value); renderCompare(); };
  $('swap').onclick = () => { [cmpA, cmpB] = [cmpB, cmpA]; renderCompare(); };
  left.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    hidden.has(b.dataset.chip) ? hidden.delete(b.dataset.chip) : hidden.add(b.dataset.chip); renderCompare();
  });
  if (keepFocus && $(keepFocus)) $(keepFocus).focus();
}

function renderTree() {
  const tops = A.roots(model).sort((a, b) => b.bytesElsewhere - a.bytesElsewhere);
  const max = Math.max(1, ...tops.map(n => n.bytesElsewhere + n.internalBytes));
  const out = ['<div class="legend"><i></i>has a copy outside the folder<b></b>internal duplicates (extra copies inside it)</div>',
    '<div class="row hdr"><span>Folder</span><span></span><span class="num">elsewhere</span><span class="num">files</span><span class="num">internal</span></div>'];
  const walk = (n, depth) => {
    const kids = n.children.size;
    const open = expanded.has(n.path);
    const w1 = 100 * n.bytesElsewhere / max, w2 = 100 * n.internalBytes / max;
    const total = n.total ? ` <span class="muted">of ${n.total.files.toLocaleString()}</span>` : '';
    out.push(`<div class="row${n.path === selected ? ' sel' : ''}" data-path="${esc(n.path)}">`
      + `<span class="name" style="padding-left:${depth * 14}px"><span class="tw" data-toggle="1">${kids ? (open ? '▾' : '▸') : ''}</span>${esc(n.name)}</span>`
      + `<span class="bar"><i style="width:${w1}%"></i><b style="width:${w2}%"></b></span>`
      + `<span class="num">${B(n.bytesElsewhere)}</span><span class="num">${n.filesElsewhere.toLocaleString()}${total}</span>`
      + `<span class="num muted">${n.internalBytes ? B(n.internalBytes) : ''}</span></div>`);
    if (open) for (const c of childrenOf(n)) walk(c, depth + 1);
  };
  for (const t of tops) walk(t, 0);
  $('left').innerHTML = out.join('');
}

let pairRows = null;
function renderPairs() {
  if (!pairRows) pairRows = A.pairs(model);
  const f = ($('pairsFilter') && $('pairsFilter').value || '').toLowerCase();
  const rows = (f ? pairRows.filter(p => (p.a + ' ' + p.b).toLowerCase().includes(f)) : pairRows).slice(0, 500);
  const keep = $('pairsFilter') ? $('pairsFilter').value : '';
  $('left').innerHTML = `<input id="pairsFilter" placeholder="Filter pairs by path text" value="${esc(keep)}">`
    + `<div class="legend">${pairRows.length.toLocaleString()} pairs of folders that directly hold copies of each other's files. Showing up to 500.</div>`
    + '<table><tr><th>Folder A</th><th class="num">A files with a copy in B</th><th>Folder B</th><th class="num">B files with a copy in A</th><th></th></tr>'
    + rows.map(p => `<tr><td class="path"><a data-select="${esc(p.a)}">${esc(p.a)}</a></td><td class="num">${p.aFiles} · ${B(p.aBytes)}</td>`
      + `<td class="path"><a data-select="${esc(p.b)}">${esc(p.b)}</a></td><td class="num">${p.bFiles} · ${B(p.bBytes)}</td>`
      + `<td><a data-compare-a="${esc(p.a)}" data-compare-b="${esc(p.b)}">compare</a></td></tr>`).join('')
    + '</table>';
  const input = $('pairsFilter');
  input.oninput = () => { const pos = input.selectionStart; renderPairs(); const i = $('pairsFilter'); i.focus(); i.setSelectionRange(pos, pos); };
}

function renderDetail() {
  const right = $('right');
  if (!selected) {
    right.innerHTML = '<p class="muted">Select a folder to see where copies of its files live and which duplicate sets it holds.</p>';
    return;
  }
  const n = model.folders.get(selected);
  const outside = A.copiesOutside(model, selected);
  const sets = A.setsUnder(model, selected);
  const pct = n.total ? ` (${Math.round(100 * n.filesElsewhere / n.total.files)}% of ${n.total.files.toLocaleString()} files)` : '';
  let html = `<div class="path-title">${esc(selected)}</div>`
    + `<div class="stats"><div><span>${B(n.bytesElsewhere)}</span>has a copy outside this folder</div>`
    + `<div><span>${n.filesElsewhere.toLocaleString()}</span>duplicated files with a copy outside${esc(pct)}</div>`
    + `<div><span>${B(n.internalBytes)}</span>internal duplicates (${n.internalFiles.toLocaleString()} extra copies)</div></div>`
    + (n.total ? '' : '<p class="muted">Folder totals are not in this report, so it cannot say how much of the folder is duplicated, only how many duplicated files it holds. DFS-030\'s export adds them.</p>')
    + '<h2>Copies of these files live in</h2>';
  html += outside.length === 0 ? '<p class="muted">None outside this folder.</p>'
    : '<table><tr><th>Folder</th><th class="num">files</th><th class="num">space</th><th></th></tr>'
      + outside.slice(0, 100).map(o => `<tr><td class="path"><a data-select="${esc(o.folder)}">${esc(o.folder)}</a></td><td class="num">${o.files}</td><td class="num">${B(o.bytes)}</td>`
        + (o.folder.startsWith(selected + '/') || selected.startsWith(o.folder + '/') ? '<td></td>' : `<td><a data-compare-a="${esc(selected)}" data-compare-b="${esc(o.folder)}">compare</a></td>`) + '</tr>').join('')
      + '</table>' + (outside.length > 100 ? `<p class="muted">${outside.length - 100} more folders not shown.</p>` : '');
  html += `<h2>Duplicate sets touching this folder (${sets.length.toLocaleString()})</h2>`;
  html += sets.slice(0, 200).map(s => `<div class="set"><div>${B(s.reclaimable)} reclaimable · ${s.set.copies.length} copies × ${B(s.set.size)}</div><div class="paths">`
    + s.members.map(m => `<div class="${m.path.startsWith(selected + '/') ? 'in' : 'muted'}">${esc(m.raw)}</div>`).join('') + '</div></div>').join('')
    + (sets.length > 200 ? `<p class="muted">${sets.length - 200} more sets not shown.</p>` : '');
  right.innerHTML = html;
  right.scrollTop = 0;
}

function select(path) {
  if (!model.folders.has(path)) return;
  selected = path;
  for (let p = model.folders.get(path).parent; p !== null; p = model.folders.get(p).parent) expanded.add(p);
  render();
  const el = document.querySelector(`#left .row[data-path="${CSS.escape(path)}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', e => {
  const cmp = e.target.closest('[data-compare-a]');
  if (cmp) { e.stopPropagation(); openCompare(cmp.dataset.compareA, cmp.dataset.compareB); }
}, true);
$('left').addEventListener('click', e => {
  if (tab === 'compare') return;
  const link = e.target.closest('[data-select]');
  if (link) { select(link.dataset.select); return; }
  const row = e.target.closest('.row[data-path]');
  if (!row) return;
  const path = row.dataset.path;
  if (e.target.dataset.toggle || path === selected) {
    expanded.has(path) ? expanded.delete(path) : expanded.add(path);
  }
  selected = path;
  render();
});
$('right').addEventListener('click', e => {
  const link = e.target.closest('[data-select]');
  if (link) { tab = 'tree'; setTab(); select(link.dataset.select); }
});
function setTab() { document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab)); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  if (tab === 'compare' && !cmpA && selected) cmpA = selected;
  setTab(); render();
});

function readFile(file) { file.text().then(t => { pairRows = null; load(t, file.name); }); }
$('file').onchange = e => e.target.files[0] && readFile(e.target.files[0]);
const drop = $('drop');
document.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
document.addEventListener('dragleave', () => drop.classList.remove('over'));
document.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
</script>
</body>
</html>
