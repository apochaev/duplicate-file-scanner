# Loopback only, on a port chosen at startup (docs/design/ui.md U10; DFS-035 decision 3).
server.address=127.0.0.1
server.port=0
spring.main.banner-mode=off
# Open the printed link in the browser at startup (DFS-036 decision 5); tests set it to false.
dfs.server.open-browser=true
# The session cookie the token link sets (DFS-036 decisions 3 and 7).
server.servlet.session.cookie.name=DFS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
springdoc.api-docs.enabled=false
# The API is everything under /api (D2); the token page "/" is not part of the spec.
springdoc.paths-to-match=/api/**
# A login never expires from idleness (DFS-066 decision 1); zero or negative means no timeout.
server.servlet.session.timeout=0
