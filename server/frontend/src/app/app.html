<mat-toolbar class="app-bar">
  <h1>Duplicate File Scanner</h1>
  @if (connection() === 'connected') {
    <span class="connection" role="status">Connected</span>
  }
</mat-toolbar>
<main>
  @switch (connection()) {
    @case ('connected') {
      <router-outlet />
    }
    @case ('disconnected') {
      <p>Open the link printed in the console</p>
    }
  }
</main>
