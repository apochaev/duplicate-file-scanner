<nav class="folder-tree" aria-label="Scan folders">
  <button mat-button type="button" class="all-folders" [attr.aria-pressed]="selected() === null" (click)="select(null)">
    All folders
  </button>
  <div class="folder-columns" aria-hidden="true">
    <span class="folder-columns-name">Folder</span>
    <span class="folder-columns-size">Size</span>
    <span class="folder-columns-duplicates">Duplicates</span>
  </div>
  <mat-tree [dataSource]="rows()" [levelAccessor]="levelOf" [expansionKey]="keyOf" [trackBy]="trackRow" aria-label="Folders">
    <mat-tree-node
      *matTreeNodeDef="let row"
      matTreeNodePadding
      matTreeNodePaddingIndent="12"
      class="folder-node"
      [isExpandable]="row.folder.hasChildren"
      (expandedChange)="expandedChange(row, $event)"
    >
      <div class="folder-row">
        @if (row.folder.hasChildren) {
          <button
            mat-button
            matTreeNodeToggle
            type="button"
            class="folder-toggle"
            [attr.aria-label]="(row.expanded ? 'Collapse ' : 'Expand ') + row.folder.name"
          >
            {{ row.expanded ? '▾' : '▸' }}
          </button>
        } @else {
          <span class="folder-toggle-space"></span>
        }
        <button
          type="button"
          class="folder-select"
          [attr.aria-pressed]="selected() === row.folder.path"
          [attr.title]="row.folder.path"
          (click)="select(row.folder.path)"
        >
          <span class="folder-name">{{ row.folder.name }}</span>
          <span class="folder-bar" aria-hidden="true">
            <span class="folder-bar-fill" [style.width.%]="duplicateWidth(row.folder)"></span>
          </span>
          <span class="folder-size">{{ formatBytes(row.folder.bytes) }}</span>
          <span class="folder-duplicate-size">{{ formatBytes(row.folder.duplicateBytes) }}</span>
        </button>
        <button
          mat-button
          type="button"
          class="folder-pin"
          [attr.aria-label]="'Pin for comparison: ' + row.folder.name"
          (click)="pin(row.folder.path)"
        >
          Pin for comparison
        </button>
      </div>
      @if (row.loading) {
        <mat-progress-bar mode="indeterminate" aria-label="Loading subfolders" />
      }
      @if (row.error) {
        <p class="folder-error" role="alert">{{ row.error }}</p>
      }
    </mat-tree-node>
  </mat-tree>
</nav>
