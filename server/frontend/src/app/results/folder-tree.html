<nav class="folder-tree" aria-label="Scan folders">
  <button mat-button type="button" class="all-folders" [attr.aria-pressed]="selected() === null" (click)="select(null)">
    All folders
  </button>
  <mat-tree [dataSource]="rows()" [levelAccessor]="levelOf" [expansionKey]="keyOf" [trackBy]="trackRow" aria-label="Folders">
    <mat-tree-node
      *matTreeNodeDef="let row"
      matTreeNodePadding
      class="folder-node"
      [isExpandable]="row.folder.hasChildren"
      (expandedChange)="expandedChange(row, $event)"
    >
      <div class="folder-row">
        @if (row.folder.hasChildren) {
          <button
            mat-button
            matTreeNodeToggle
            type="button"
            class="folder-toggle"
            [attr.aria-label]="(row.expanded ? 'Collapse ' : 'Expand ') + row.folder.name"
          >
            {{ row.expanded ? '▾' : '▸' }}
          </button>
        } @else {
          <span class="folder-toggle-space"></span>
        }
        <button
          mat-button
          type="button"
          class="folder-select"
          [attr.aria-pressed]="selected() === row.folder.path"
          (click)="select(row.folder.path)"
        >
          {{ folderLabel(row.folder) }}
        </button>
      </div>
      @if (row.loading) {
        <mat-progress-bar mode="indeterminate" aria-label="Loading subfolders" />
      }
      @if (row.error) {
        <p class="folder-error" role="alert">{{ row.error }}</p>
      }
    </mat-tree-node>
  </mat-tree>
</nav>
