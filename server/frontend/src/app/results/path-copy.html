<button mat-button type="button" class="copy-path-button" [attr.aria-label]="'Copy path of ' + path()" (click)="copy()">
  Copy
</button>
@if (copied()) {
  <span class="copy-success" role="status">Copied</span>
}
@if (failure(); as message) {
  <span class="copy-error" role="alert">{{ message }}</span>
  <code class="copy-fallback" tabindex="0" aria-label="Path to copy by hand">{{ path() }}</code>
}
